<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - CHIC DJASSA ADMIN</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="login-box">

        <h1>CHIC DJASSA ADMIN</h1>

        <p>Connectez-vous pour accéder à l'administration</p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Nom d'utilisateur"
                autocomplete="username"
                required
            >

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Code de connexion"
                    autocomplete="current-password"
                    required
                >

                <span id="togglePassword">👁️</span>

            </div>

            <button type="submit">
                Se connecter
            </button>

            <p id="message"></p>

        </form>

    </div>

    <script src="login.js"></script>

</body>

</html>
